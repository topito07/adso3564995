<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        
        div.gallery {
            display: grid;
            gap: 8px;
            margin: 2rem auto;
            width: 380px;
            padding: 8px;
            border-radius: 8px;

            
        }

        div.gallery div {
            background-color: #fff;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #fff; 
        }

        div.gallery div img {
            width: 100%;
            height: 100%;
            display: block;
        }

      
        div.gallery-1 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 120px);
            grid-template-areas: 
                "one   two   three"
                "four  two   five"
                "six   six   seven";
        }

        div.gallery-1 div:nth-child(1) { grid-area: one; }   
        div.gallery-1 div:nth-child(2) { grid-area: two; }   
        div.gallery-1 div:nth-child(3) { grid-area: three; } 
        div.gallery-1 div:nth-child(4) { grid-area: four; }  
        div.gallery-1 div:nth-child(5) { grid-area: five; }  
        div.gallery-1 div:nth-child(6) { grid-area: six; }   
        div.gallery-1 div:nth-child(7) { grid-area: seven; } 

        div.gallery-2 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            grid-template-areas: 
                "one  one  two   three"
                "one  one  four  four"
                "five six  four  four";
        }

        div.gallery-2 div:nth-child(1) { grid-area: one; }  
        div.gallery-2 div:nth-child(2) { grid-area: two; }   
        div.gallery-2 div:nth-child(3) { grid-area: three; } 
        div.gallery-2 div:nth-child(4) { grid-area: four; }  
        div.gallery-2 div:nth-child(5) { grid-area: five; }  
        div.gallery-2 div:nth-child(6) { grid-area: six; }   
    </style>
</head>
