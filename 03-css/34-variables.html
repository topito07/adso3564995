<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34-variables</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        :root{
            --btn-width: 320px;
            --btn-padding:0.4rem 0.8rem;
            --primary-color: #3a91ee;
            --secondary-color: #727e8a;
            --primary-border: 4px solid #a3cfff;
            --secondary-border: 4px solid #c5d1dc;
        }
        section{
            button.btn{
                border-radius: 8px;
                corner-shape: squircle;
                display: block;
                margin: 0.4rem auto;
                width: var(--btn-width);
                padding: var(--btn-padding);

                &.btn1{
                    background: var(--primary-color);
                    border: var(--primary-border);
                }
                &.btn2{
                    background: var(--secondary-color);
                    border: var(--secondary-color);
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                    </svg>
                </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>34-variables</h1>
            <img src="../src/images/logo-css.png" alt="css">
            <h3>The var() function is used to insert the value of a CSS variable.</h3>
        </header>
        <section>
            <h3 class="subtitle">examples:</h3>
            <button class="btn btn1">primary</button>
            <button class="btn btn2">secondary</button>
        </section>
    </main>
</body>
</html>
