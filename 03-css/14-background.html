<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-background</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        section{
            div{
                border: 2px solid #fff9;
                margin: 2rem auto;
                height: 200px;
                width: 340px;
                &.bg01 {
                    background-color: #0051c299;
                }
                &.bg02 {
                    background-image: url(imgs/mario.png);
                    background-position: center;
                    background-size: 66px;
                }
                &.bg03 {
                    background-image: url(imgs/mario.png);
                    background-repeat: no-repeat;
                    background-size: 66px;
                }
                &.bg04 {
                    background-image: url(imgs/mario.png);
                    background-repeat: no-repeat;
                    background-position: center;
                    background-size: 66px;
                }
                 &.bg05 {
                    /*Every Propierety */
                    background-image: url(imgs/mario.png);
                    background-repeat: no-repeat;
                    background-position: center;
                    background-size: contain;
                    /*Short Hand */
                    background: url(imgs/mario.png) no-repeat center /contain ;

                }
                &.bg06 {
                    background-image: url(imgs/mario.png);
                    background-size: 7%;
                    background-attachment: fixed;
                }

            }
        }
    </style>
</head>

            <img src="../src/images/logo-css.png" alt="css">
            <h3>Description
                <ul>
                    <li>background-color</li>
                    <li>background-image</li>
                    <li>background-repeat</li>
                    <li>background-position</li>
                    <li>background-size</li>
                    <li>background-attachment</li>
                </ul>
            </h3>
        </header>
        <section>
            <h3 class="subtitle">background-color</h3>
            <div class="bg01"></div>
