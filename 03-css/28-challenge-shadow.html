    <link rel="stylesheet" href="../master.css">
    <style>
        section{
            figure.frame {
            outline: 20px solid #fff;
            background: linear-gradient(to top, #663399, #dbb6ff);
            height: calc(31 * 20px); /* Y:32 */
            width:  calc(32 * 20px); /* X:31 */
            margin: 2rem auto;
            zoom: 0.35;
            transition: all 0.2s ease-in;
            &:hover {
                transform: scale(1.6);
            }
        }
        div.squares {
            background: url(imgs/square.png);
            /* filter: invert(100%); */
            opacity: 0.5;
            z-index: 2;
            margin-top: -20px;
            height: calc(31 * 20px);
        }
