<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box-shadow</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        section {
            div.box{
                border: 2px solid #fff;
                background-color: #caa0f5bb;
                height: 200px;
                margin: 2rem auto;
                width: 300px;
                &.box1{
                    box-shadow: 0px 0px 12px #fff;
                }
                &.box2{
                    box-shadow: -10px -10px 24px 0 #fff ;
                }
                &.box3{
                    box-shadow: 0px 0px 12px #fff inset;
                }
                &.box4{
                    box-shadow: 4px 4px 0 0 #ffca00, 8px 8px 0 0 #003087, 12px 12px 0 0 #c8102e;
                }
            }
            div.images{
                text-align: center;
                img{
                    width: 160px;

                    &:first-of-type{
                        box-shadow: 0 0 12px 0 #fff;
                    }
                    &:last-of-type{
                        filter: drop-shadow(0 0 12px #fff);
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                    </svg>
                </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>27-box-shadow</h1>
            <img src="../src/images/logo-css.png" alt="css">
            <h3>Property attaches one or more shadows to an element.</h3>
        </header>
        <section>
            <h3 class="subtitle">box-shadow: 0 0 12px #fff</h3>
            <div class="box box1"></div>
            <h3 class="subtitle">box-shadow: -10px -10px 24px 0 #fff</h3>
            <div class="box box2"></div>
            <h3 class="subtitle">box-shadow: 0 0 20px #fff inset</h3>
            <div class="box box3"></div>
            <h3 class="subtitle">box-shadow: multiple</h3>
            <div class="box box4"></div>
            <h3 class="subtitle">box-shadow VS drop-shadow()</h3>
            <div class="images">
                <img src="imgs/mario.png">
                <img src="imgs/mario.png">
            </div>
        </section>
    </main>
</body>
</html>
