<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-tables</title>
    <link rel="stylesheet" href="../master.css">
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
            thead{
                th{
                    background-color: #e44d26;
                    border: 2px solid #fff9;
                    color: #000;
                    padding: 0.4rem;

                }
            }
            tbody {
                tr{
                    &:nth-child(even){
                        background-color: #fff3;
                    }
                    td{
                        border: 2px solid #fff9;
                        color: #fff9;
                        padding: 0.4rem;

                    }
                }
            }
            tfoot {
                td{
                    background-color: #e44d26;
                    border: 2px solid #fff9;
                    color: #000;
                    padding: 0.4rem;
                    text-align: center;
                }
            }
        }
    </style>
</head>
<body class="html">
    <nav class="goback">
        <a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                    </svg>
                </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>09-tables</h1>
            <img src="../src/images/logo-html.png" alt="HTML Logo">
            <h3>Creates tables for data display. </h3>
        </header>
        <section>
            <h3 class="subtitle">Example</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>FullName</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>01</td>
                        <td>Homer Simpson</td>
                        <td>Homer@gmail.com</td>
                    </tr>
                    <tr>
                        <td>02</td>
                        <td>Marge Simpson</td>
                        <td>Marge@gmail.com</td>

                    </tr>
                    <tr>
                        <td>03</td>
                        <td>Bart Simpson</td>
                        <td>Bart@gmail.com</td>

                    </tr>
                    <tr>
                        <td>04</td>
                        <td>Lisa Simpson</td>
                        <td>Lisa@gmail.com</td>

                    </tr>
                    <tr>
                        <td>05</td>
                        <td>Maggie Simpson</td>
                        <td>Maggie@gmail.com</td>

                    </tr>
                </tbody>
                <tfoot>
                    <td colspan="3">Familia Simpson</td>
                </tfoot>
            </table>
        </section>
    </main>
</body>
</html>
